<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- SEO — {{TITRE_SEO}} : 60 caractères au plus (au-delà, Google tronque) et le mot-clé
     principal en tête. {{META_DESCRIPTION}} : 150 à 160 caractères, contenant le mot-clé. -->
<title>{{TITRE_SEO}}</title>
<meta name="description" content="{{META_DESCRIPTION}}" />
<link rel="canonical" href="https://languagesandsuccess.com/blog/{{SLUG}}.html" />

<!-- Aperçu lors d'un partage sur LinkedIn, Facebook, WhatsApp… -->
<meta property="og:type" content="article" />
<meta property="og:locale" content="fr_FR" />
<meta property="og:site_name" content="Languages &amp; Success" />
<meta property="og:title" content="{{TITRE}}" />
<meta property="og:description" content="{{META_DESCRIPTION}}" />
<meta property="og:url" content="https://languagesandsuccess.com/blog/{{SLUG}}.html" />
<meta property="og:image" content="https://languagesandsuccess.com/blog/img/{{SLUG}}.svg" />
<meta property="article:published_time" content="{{DATE_ISO}}" />
<meta property="article:section" content="{{CATEGORIE}}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/png" href="../assets/ls-logo.png" />
<link rel="stylesheet" href="../assets/fonts.css?v=BUILD" />
<link rel="stylesheet" href="../assets/site.css?v=BUILD" />

<!-- Fiche de l'article : c'est elle qui alimente la grille de blog.html. Ne pas la retirer. -->
<script type="application/json" id="ls-meta">
{
  "titre": "{{TITRE}}",
  "chapo": "{{CHAPO}}",
  "categorie": "{{CATEGORIE}}",
  "date": "{{DATE_ISO}}",
  "image": "img/{{SLUG}}.svg",
  "motCle": "{{MOT_CLE}}",
  "statut": "brouillon"
}
</script>

<!-- Données structurées : l'article, le fil d'Ariane et la FAQ. ⚠️ Le bloc FAQ doit reprendre
     EXACTEMENT les questions et réponses visibles plus bas — sinon Google le rejette. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Article",
      "headline": "{{TITRE}}",
      "description": "{{META_DESCRIPTION}}",
      "image": "https://languagesandsuccess.com/blog/img/{{SLUG}}.svg",
      "datePublished": "{{DATE_ISO}}",
      "dateModified": "{{DATE_ISO}}",
      "inLanguage": "fr-FR",
      "articleSection": "{{CATEGORIE}}",
      "mainEntityOfPage": "https://languagesandsuccess.com/blog/{{SLUG}}.html",
      "author": { "@type": "Organization", "name": "Languages & Success" },
      "publisher": {
        "@type": "Organization",
        "name": "Languages & Success",
        "logo": { "@type": "ImageObject", "url": "https://languagesandsuccess.com/assets/ls-logo.png" }
      }
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Accueil", "item": "https://languagesandsuccess.com/" },
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://languagesandsuccess.com/blog.html" },
        { "@type": "ListItem", "position": 3, "name": "{{TITRE}}" }
      ]
    },
    {
      "@type": "FAQPage",
      "mainEntity": [
{{FAQ_JSONLD}}
      ]
    }
  ]
}
</script>
</head>
<body>
<div id="ls-nav"></div>

<header class="page-hero" style="padding-bottom:20px">
  <div class="wrap">
    <div class="crumbs"><a href="../index.html">Accueil</a> · <a href="../blog.html">Blog</a> · {{CATEGORIE}}</div>
    <span class="eyebrow">{{CATEGORIE}}</span>
    <!-- UN SEUL h1 par page : le titre, contenant le mot-clé principal. -->
    <h1 style="font-size:clamp(30px,4.4vw,52px)">{{TITRE}}</h1>
    <p class="lead">{{CHAPO}}</p>
  </div>
</header>

<section class="sec" style="padding-top:14px">
  <div class="wrap">
    <img class="art-cover" src="img/{{SLUG}}.svg" alt="{{ALT_COUVERTURE}}" width="1200" height="630" />
    <div class="prose">
      <p class="updated">Publié le {{DATE_LISIBLE}} · par l'équipe pédagogique Languages &amp; Success</p>

<!-- CORPS : 4 à 6 sections en <h2>, sous-parties en <h3>. Le mot-clé principal doit figurer
     dans le premier paragraphe ET dans au moins un <h2>. Placer 2 ou 3 liens internes vers
     les pages du site (../formations.html, ../financement.html, ../contact.html…).
     Illustration en cours d'article : <img class="art-illu" src="img/…" alt="…" /> -->
{{CORPS}}

      <h2>Questions fréquentes</h2>
{{FAQ_HTML}}

      <h2>Sources</h2>
{{SOURCES}}

      <p class="art-retour"><a href="../blog.html">← Tous les articles</a></p>
    </div>
  </div>
</section>

<div id="ls-footer"></div>
<script>window.LS_CONFIG={key:'sub'};</script>
<script src="../assets/partials.js?v=BUILD"></script>
<script src="../ls-engine.js"></script>
</body>
</html>
