services:
  mon-site:
    build: .
    container_name: site-bmax
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # SMTP (e-mails de notification) : valeurs injectées depuis le .env
      # (secret GitHub ENV_FILE). Vides = e-mails désactivés proprement.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - SITE_URL=${SITE_URL:-https://languagesandsuccess.com}
      # Webhook Slack du canal #contact (formulaires du site). Vide = Slack désactivé proprement.
      - SLACK_WEBHOOK=${SLACK_WEBHOOK:-}
      # OU le jeton du robot de l application Slack (scope chat:write) + le canal cible
      - SLACK_TOKEN=${SLACK_TOKEN:-}
      - SLACK_CHANNEL=${SLACK_CHANNEL:-}
      # URL de l application web Apps Script du registre des prospects (Google Sheet). Vide = registre désactivé proprement.
      - SHEET_WEBHOOK=${SHEET_WEBHOOK:-}
      # Sauvegarde offsite quotidienne (Backblaze B2) : valeurs injectées depuis
      # le .env (secret GitHub ENV_FILE). Vides = sauvegarde désactivée proprement.
      - B2_KEY_ID=${B2_KEY_ID:-}
      - B2_APP_KEY=${B2_APP_KEY:-}
      - B2_BUCKET=${B2_BUCKET:-}
      - B2_BUCKET_ID=${B2_BUCKET_ID:-}
    volumes:
      # Données persistantes (db.json, uploads, backups) : SURVIVENT aux déploiements.
      - ls-data:/app/data

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  ls-data:
